[package]
name = "keymaker"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.8", features = ["macros"] }
dterror = "0.1.0"
keyfork-derive-openpgp = { version = "0.2.0", registry = "distrust", default-features = false }
keyfork-derive-path-data = { version = "0.1.3", registry = "distrust" }
keyfork-entropy = { version = "0.1.2", registry = "distrust", default-features = false }
keyfork-mnemonic = { version = "0.4.1", registry = "distrust", default-features = false }
keyfork-shard = { version = "0.4.0", registry = "distrust", default-features = false, features = ["openpgp", "openpgp-card"] }
keymaker-models = { version = "0.1.0", path = "../keymaker-models" }
sequoia-openpgp = "1"
serde = "1.0.228"
serde_json = "1.0.149"
sha2 = "0.10.9"
structstruck = "0.5.1"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "net"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
zalloc = "0.1.0"

nix = { version = "0.31.2", default-features = false, features = ["reboot"], optional = true }

[dev-dependencies]
reqwest = "0.13.2"

[features]
default = ["selfnuke"]
selfnuke = ["dep:nix"]
