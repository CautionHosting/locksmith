[package]
name = "public-cert-service"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish.workspace = true

[dependencies]
locksmith = { path = "../locksmith" }
dterror = "0.1.0"
anyhow = "1.0.102"
bootproof = { git = "https://codeberg.org/caution/bootproof.git", rev = "821b5c63e80f082f6d67ba3695c11416933489ec", version = "0.1.0" }
axum = { version = "0.8.8", features = ["macros"] }
hex = "0.4.3"
keyfork-derive-openpgp = { version = "0.2.1", registry = "distrust", default-features = false }
keyfork-derive-path-data = { version = "0.1.3", registry = "distrust", default-features = false }
keyfork-derive-util = { version = "0.2.3", registry = "distrust", default-features = false }
keyforkd-client = { version = "0.2.2", registry = "distrust", default-features = false, features = ["ed25519"] }
public-certificate-models = { version = "0.1.0", path = "../public-certificate-models" }
sequoia-openpgp = "1"
serde = "1.0.228"
serde_json = "1.0.149"
serde_cbor = "0.11.2"
uuid = { version = "1.18.1", features = ["v4"] }
sha2 = "0.10.0"
subtle = "2"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zalloc = "0.1.0"

[dev-dependencies]
keyfork-mnemonic = { version = "0.4.2", registry = "distrust", default-features = false }
# Sibling workspace model crate, identical to keymaker/keymaker-client dependencies.
keymaker-models = { version = "0.1.0", path = "../keymaker-models" }
keyforkd = { version = "0.1.5", registry = "distrust", default-features = false }
keyfork-shard = { version = "0.4.0", registry = "distrust", default-features = false, features = ["openpgp"] }
webauthn-rs = "0.5.5"
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softpasskey"] }
tower = { version = "0.5.3", features = ["util"] }

[features]
unsafe-e2e = ["locksmith/unsafe-e2e"]
