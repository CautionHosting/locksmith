[package]
name = "public-cert-service"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow = "1.0.102"
bootproof = { git = "https://git.distrust.co/public/bootproof", version = "0.1.0" }
axum = { version = "0.8.8", features = ["macros"] }
hex = "0.4.3"
keyfork-derive-openpgp = { version = "0.2.1", registry = "distrust", default-features = false }
keyfork-derive-path-data = { version = "0.1.3", registry = "distrust", default-features = false }
keyfork-derive-util = { version = "0.2.3", registry = "distrust", default-features = false }
keyforkd-client = { version = "0.2.2", registry = "distrust", default-features = false, features = ["ed25519"] }
public-certificate-models = { version = "0.1.0", path = "../public-certificate-models" }
sequoia-openpgp = "1"
serde = "1.0.228"
serde_json = "1.0.149"
serde_cbor = "0.11.2"
uuid = { version = "1.18.1", features = ["v4"] }
sha2 = "0.10.0"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["macros", "net", "rt-multi-thread", "sync"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zalloc = "0.1.0"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
