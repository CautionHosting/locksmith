[package]
name = "keymaker-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
dterror = "0.1.0"
keyfork-derive-openpgp = { version = "0.2.0", registry = "distrust", default-features = false }
keyfork-derive-path-data = { version = "0.1.3", registry = "distrust" }
keyfork-entropy = { version = "0.1.2", registry = "distrust", default-features = false }
keyfork-mnemonic = { version = "0.4.1", registry = "distrust", default-features = false }
keyfork-shard = { version = "0.4.0", registry = "distrust", default-features = false, features = ["openpgp", "openpgp-card"] }
keymaker-models = { version = "0.1.0", path = "../keymaker-models" }
sequoia-openpgp = "1"
sha2 = "0.10.9"
structstruck = "0.5.1"
thiserror = "2.0.18"
tracing = "0.1.44"

# Optional HTTP glue (ApiError, ErrorResponse, error_logger_middleware)
axum = { version = "0.8.8", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[features]
axum = ["dep:axum", "dep:serde"]

[dev-dependencies]
keyfork-prompt = { version = "0.2.5", registry = "distrust" }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
