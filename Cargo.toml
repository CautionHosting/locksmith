[workspace]
resolver = "3"
members = [
	"crates/keymaker-models",
	"crates/keymaker",
	"crates/keymaker-client",
	"crates/locksmith",
	"crates/public-certificate-models",
	"crates/public-cert-service",
]

[workspace.package]
license = "AGPL-3.0-only OR LicenseRef-Caution-Commercial"
